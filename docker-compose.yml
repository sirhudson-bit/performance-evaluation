# OPTIONAL convenience compose file.
#
# The default run path needs only Node.js + a local PostgreSQL and does NOT use
# Docker. Use this only if you prefer containers.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: performance_evaluation
    ports:
      - '55433:5432'
    volumes:
      - pe-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/performance_evaluation?schema=public
      APP_KEY: ${APP_KEY:?set APP_KEY}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PORT: '4000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  pe-db:
