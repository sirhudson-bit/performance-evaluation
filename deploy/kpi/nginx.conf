# kpi.namirahamrah.ir — nginx reverse proxy (HTTP only; certbot adds TLS).
# Installed by deploy/kpi/bootstrap.sh to /etc/nginx/sites-available/kpi
# __DOMAIN__ and __WEB_PORT__ are substituted at install time.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Excel imports and attachment uploads go through the API.
    client_max_body_size 25m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (pages + /api/v1, which Next rewrites to the API service).
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
